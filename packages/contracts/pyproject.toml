[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "0.1.0"
description = "Shared Pydantic models for messaging, money and identity"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[tool.setuptools]
packages = ["contracts"]
