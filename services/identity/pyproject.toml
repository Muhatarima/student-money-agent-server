[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Our alembic/ folder has the same name as the library; imports mean the library
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's normal style: def route(session = Depends(get_session))
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]
