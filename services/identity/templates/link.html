<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Your Account - Student Money Agent</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status {
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }
        .status.error { color: var(--danger); display: block; }
        .status.info { color: var(--muted); display: block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔐</div>
        <h1>Secure Your Account</h1>
        <p>Link your WhatsApp account using your device's biometric security (fingerprint, Face ID, or screen lock). No passwords needed.</p>

        <button id="btn-register" class="btn" onclick="startPasskeyRegistration()">
            <span>Fingerprint / Face ID</span>
        </button>

        <div id="status-msg" class="status"></div>
    </div>

    <!-- Pinned UMD bundle for SimpleWebAuthn browser -->
    <script src="https://unpkg.com/@simplewebauthn/browser@10.0.0/dist/bundle/index.umd.min.js"></script>
    <script src="/static/passkey.js"></script>
    <script>
        const token = "{{ token }}";
        async function startPasskeyRegistration() {
            const btn = document.getElementById("btn-register");
            const status = document.getElementById("status-msg");
            btn.disabled = true;
            status.className = "status info";
            status.textContent = "Requesting passkey...";

            try {
                await registerPasskeyWithToken(token);
                window.location.href = "/done";
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                status.className = "status error";
                status.textContent = err.message || "Passkey registration failed. Please try again.";
            }
        }
    </script>
</body>
</html>
